<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#000000">
    <title>404 | Marc García-Cuevas</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap">
    <script>
        // Les antigues pàgines de serveis ja no existeixen: portem el visitant a la portada del seu idioma.
        (function () {
            var p = location.pathname;
            if (/serveis|servicios|services/i.test(p)) {
                location.replace(/^\/es\//.test(p) ? "/es/" : /^\/en\//.test(p) ? "/en/" : "/");
            }
        })();
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: "Instrument Sans", system-ui, sans-serif; }
        main { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(22px, 6vw, 72px); }
        h1 { font-weight: 400; letter-spacing: -0.05em; line-height: 1; font-size: clamp(5rem, 22vw, 14rem); margin: 0; }
        p { color: #b8b8b8; font-size: clamp(1rem, 2.2vw, 1.3rem); margin: 14px 0 34px; }
        a { display: inline-block; align-self: flex-start; color: #000; background: #fff; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 500; }
        small { color: #777; letter-spacing: .14em; font-size: .72rem; text-transform: uppercase; margin-bottom: 18px; }
    </style>
</head>
<body>
    <main>
        <small>Marc García-Cuevas</small>
        <h1>404</h1>
        <p id="msg">Aquesta pàgina no existeix.</p>
        <a id="home" href="/">Tornar a l'inici</a>
    </main>
    <script>
        var t = { es: ["Esta página no existe.", "Volver al inicio", "/es/"], en: ["This page doesn't exist.", "Back to home", "/en/"] };
        var l = /^\/es\//.test(location.pathname) ? "es" : /^\/en\//.test(location.pathname) ? "en" : "";
        if (l) { document.documentElement.lang = l; msg.textContent = t[l][0]; home.textContent = t[l][1]; home.href = t[l][2]; }
    </script>
</body>
</html>
